name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test
        run: ./scripts/build.sh
      - name: Package app
        run: ./scripts/package.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Bar-macOS
          path: release/Codex-Usage-Bar-1.0.1-macOS.zip
